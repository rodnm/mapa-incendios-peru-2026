[project]
name = "mapa-incendios-peru-2026"
version = "0.1.0"
description = "Exposicion de la poblacion a incendios activos en el Peru (temporada 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "rasterio>=1.4",
    "rasterstats>=0.20",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "huggingface_hub>=0.25",
    "duckdb>=1.1",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "topojson>=1.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[tool.uv]
package = false
